[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-bulgaria-bg"
version = "0.1.0"
description = "Country pack for the Bulgarian market: КСС estimating with all-in unit rates, EUR with lev amounts at the fixed 1.95583, ДДС at 20%, the company ЕИК checked by its check digit, ЗУТ construction categories I-VI on every Bulgarian project, and the Bulgarian construction vocabulary."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OpenConstructionERP", email = "info@datadrivenconstruction.io" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "country-pack",
    "bulgaria",
    "bulgariya",
    "kss",
    "dds",
    "zut",
    "eik",
    "eur",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Bulgarian",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=5.5.0",
]

[project.urls]
Source = "https://github.com/DataDrivenConstruction/openconstructionerp"

[project.entry-points."openconstructionerp.partner_packs"]
bulgaria-bg = "openconstructionerp_bulgaria_bg:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_bulgaria_bg = [
    "onboarding.yaml",
    "locales/*.json",
    "rule_packs/*.json",
]
