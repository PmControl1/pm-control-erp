# Dependabot — automated dependency updates

version: 2

updates:
  # Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # Keep each runtime/library family in one update pull request.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      ag-grid:
        patterns: ["ag-grid-react", "ag-grid-community"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Defer these coordinated major migrations until after the Bulgarian pilot.
    # Remove the relevant rules only as part of a tested family-wide migration.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ag-grid-community"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # Docker
  - package-ecosystem: "docker"
    directory: "/deploy/docker"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
